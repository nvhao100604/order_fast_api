name: Continuous Integration (CI)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Unit Tests & API Validation
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: restaurant_db
      PROJECT_NAME: order_fast_api
      SECRET_KEY: testsecretkey1234567890

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Test Database Models
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m app.tests.test_model

      - name: Test Reservation Module
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m app.tests.test_reservation

      - name: Test All New API Endpoints
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m app.tests.test_all_new_apis
